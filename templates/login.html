<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>
        Acceso Administrativo - Aguascalientes
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
        }

        .header,
        .footer {
            width: 100%;
            text-align: center;
        }

        .header img,
        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        .validacion-titulo {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #3B5998;
            letter-spacing: 1px;
            margin: 20px 0 5px;
            padding: 15px 15px 5px;
            text-transform: uppercase;
        }

        .resultado-titulo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #3B5998;
            margin: 5px 0 20px;
            padding: 10px;
            text-transform: uppercase;
        }

        .content {
            padding: 20px;
        }

        .login-box {
            background: #fff;
            border: 2px solid #e3e7ee;
            padding: 30px;
            border-radius: 14px;
            margin: 20px 0 30px;
            box-shadow: 0 5px 18px rgba(0,0,0,.08);
        }

        .login-info {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .error-msg {
            background: #fff0f0;
            border: 2px solid #e53935;
            color: #a11c1c;
            padding: 14px 16px;
            border-radius: 10px;
            margin: 0 0 20px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }

        .form-group {
            margin: 20px 0;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #d8dde6;
            border-radius: 9px;
            font-size: 16px;
            background: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3B5998;
            box-shadow: 0 0 0 3px rgba(59,89,152,.12);
        }

        .btn-login {
            background: #3B5998;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            transition: background .2s;
        }

        .btn-login:hover {
            background: #2d4373;
        }

        .volver {
            text-align: center;
            margin-top: 15px;
        }

        .volver a {
            color: #3B5998;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .volver a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .content {
                padding: 15px;
            }

            .login-box {
                padding: 22px;
            }

            .validacion-titulo {
                font-size: 18px;
                padding-top: 12px;
            }

            .resultado-titulo {
                font-size: 23px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- ENCABEZADO -->
    <div class="header">

        <img
            src="/static/encabezado.jpg"
            alt="Encabezado Aguascalientes"
        >

    </div>


    <!-- TÍTULOS -->
    <div class="validacion-titulo">
        Sistema de Permisos Digitales
    </div>

    <div class="resultado-titulo">
        Acceso Administrativo
    </div>


    <div class="content">

        <!-- ERROR -->
        {% if request.query_params.get('error') %}

        <div class="error-msg">
            ❌ Usuario o contraseña incorrectos.
        </div>

        {% endif %}


        <!-- LOGIN -->
        <div class="login-box">

            <div class="login-info">
                Ingresa tus credenciales para acceder
                al panel de administración.
            </div>


            <form
                method="POST"
                action="/panel/login"
            >

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                        autocomplete="username"
                        placeholder="Ingrese su usuario"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Ingrese su contraseña"
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >
                    INICIAR SESIÓN
                </button>

            </form>


            <div class="volver">

                <a href="/">
                    ← Volver a consulta pública
                </a>

            </div>

        </div>

    </div>


    <!-- PIE -->
    <div class="footer">

        <img
            src="/static/pie.jpg"
            alt="Pie Aguascalientes"
        >

    </div>

</div>

</body>
</html>
